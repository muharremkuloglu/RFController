[platformio]
default_envs = tx

[env:tx]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
src_dir = TX/src
lib_dir = TX/lib
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:rx]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
src_dir = RX/src
lib_dir = RX/lib
monitor_speed = 115200
upload_speed = 921600

[env]
monitor_filters = esp32_exception_decoder
