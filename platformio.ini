# ============================================================================
# 📋 platformio.ini - RF Kumanda Sistemi Build Konfigürasyonu
# ============================================================================
# 
# İŞLEV:
#   - TX (Kumanda) ve RX (RF Bridge) için build ortamlarını tanımla
#   - ESP32-S3 donanımı konfigürasyon
#   - Kütüphane bağımlılıkları (Adafruit OLED, vb)
#
# KULLANIM:
#   pio run -e tx --target upload    → TX kumanda derle ve yükle
#   pio run -e rx --target upload    → RX bridge derle ve yükle
#   pio run -e tx -t monitor         → TX seri portunu izle (115200 baud)
#   pio run -e rx -t monitor         → RX seri portunu izle
#
# KRİTİK NOKTALAR:
#   - Board: esp32-s3-devkitc-1 (ESP32-S3-N16R8 için)
#   - Seri Port: 115200 baud (debug/monitor)
#   - Yükleme Hızı: 921600 baud (hızlı)
#   - Kütüphaneler: Adafruit SSD1306 (OLED ekran)
#
# İLGİLİ DOSYALAR:
#   - shared/config.h       → PIN tanımları (ORTAK)
#   - TX/src/main.cpp       → Kumanda yazılımı
#   - RX/src/main.cpp       → RF-SBUS bridge yazılımı
#
# ============================================================================

[platformio]
default_envs = tx

[env:tx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
src_dir = TX/src
lib_dir = TX/lib
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:rx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
src_dir = RX/src
lib_dir = RX/lib
monitor_speed = 115200
upload_speed = 921600

[env]
monitor_filters = esp32_exception_decoder
